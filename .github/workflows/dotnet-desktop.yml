name: Build & Auto-Release char-ai

on:
  push:
    branches:
      - stabil   # change if you want another branch to trigger release

permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]

    env:
      Solution_Name: char-ai.sln
      Project_Path: char-ai/char-ai.csproj

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    - name: Build project
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish single-file executable
      run: dotnet publish $env:Project_Path `
            --configuration ${{ matrix.configuration }} `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:PublishTrimmed=false `
            -o ./publish/${{ matrix.configuration }}

    - name: Archive build output
      run: Compress-Archive -Path ./publish/${{ matrix.configuration }}/* -DestinationPath ./char-ai-${{ matrix.configuration }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "char-ai ${{ matrix.configuration }} build ${{ github.run_number }}"
        tag_name: "build-${{ github.run_number }}"
        files: ./char-ai-${{ matrix.configuration }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
